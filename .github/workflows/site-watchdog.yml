# 站点外部拨测死人开关：每日由 GitHub 托管运行器从外部检查两站首页可用性与
# data.json 的 last_updated 新鲜度，超阈值推送钉钉告警。
# 本机调度（check-sites.mjs）与本管线互为独立：本机全挂时由本 workflow 报警。
# Secrets：DINGTALK_WEBHOOK（必填）、DINGTALK_SECRET（加签模式填，关键词模式留空）。
name: Site Watchdog

on:
  schedule:
    # 每日 01:30 UTC（北京时间 09:30）
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Build webhook URL
        id: build_url
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          if [ -z "$DINGTALK_WEBHOOK" ]; then
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          URL="$DINGTALK_WEBHOOK"
          if [ -n "$DINGTALK_SECRET" ]; then
            TIMESTAMP=$(date +%s%3N)
            STRING_TO_SIGN="${TIMESTAMP}\n${DINGTALK_SECRET}"
            SIGN=$(printf '%b' "$STRING_TO_SIGN" | openssl dgst -sha256 -hmac "$DINGTALK_SECRET" -binary | base64)
            SIGN_ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote_plus(sys.argv[1]))" "$SIGN")
            URL="${URL}&timestamp=${TIMESTAMP}&sign=${SIGN_ENCODED}"
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Probe sites and notify
        env:
          WEBHOOK_URL: ${{ steps.build_url.outputs.url }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request

          MAX_AGE_DAYS = 7          # 与 check-sites.mjs 的 CHECK_DATA_MAX_AGE_DAYS 默认值同口径
          SEND_OK_HEARTBEAT = False # 改 true 可每日发"拨测正常"心跳：心跳断流本身即告警（完整死人开关），并保活 cron
          SITES = [
              ("CN 站", "https://www.creditsplan.cn"),
              ("COM 站", "https://www.creditsplan.com"),
          ]

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (CreditsPlan-SiteWatchdog)"})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return resp.read()

          failures, freshness = [], []
          for name, origin in SITES:
              # 首页可用性
              try:
                  fetch(origin + "/")
              except Exception as e:
                  failures.append(f"{name}：首页请求失败：{e}")
              # data.json 新鲜度
              try:
                  data = json.loads(fetch(origin + "/data.json"))
                  if not data.get("models"):
                      failures.append(f"{name}：data.json 缺少 models 数据")
                  last_updated = data.get("last_updated")
                  if not last_updated:
                      failures.append(f"{name}：data.json 缺少 last_updated 字段")
                  else:
                      from datetime import datetime, timezone
                      try:
                          ts = datetime.fromisoformat(last_updated.replace("Z", "+00:00"))
                      except ValueError:
                          failures.append(f"{name}：last_updated 无法解析：{last_updated}")
                          continue
                      if ts.tzinfo is None:
                          ts = ts.replace(tzinfo=timezone.utc)
                      age_days = (datetime.now(timezone.utc) - ts).days
                      freshness.append(f"{name} last_updated={last_updated}（{age_days} 天前）")
                      if age_days > MAX_AGE_DAYS:
                          failures.append(f"{name}：data.json 已 {age_days} 天未更新（阈值 {MAX_AGE_DAYS} 天）")
              except Exception as e:
                  failures.append(f"{name}：data.json 检查失败：{e}")

          def send(title, lines):
              if not os.environ.get("WEBHOOK_URL"):
                  print("DINGTALK_WEBHOOK 未配置，跳过通知")
                  return
              text = "\n".join([f"### {title}"] + [f"- {line}" for line in lines])
              payload = json.dumps({"msgtype": "markdown", "markdown": {"title": title, "text": text}}).encode()
              req = urllib.request.Request(os.environ["WEBHOOK_URL"], data=payload,
                                           headers={"Content-Type": "application/json"})
              resp = json.loads(urllib.request.urlopen(req, timeout=10).read())
              if resp.get("errcode") != 0:
                  print(f"DingTalk error: {resp}")
                  sys.exit(1)
              print("Notification sent successfully.")

          if failures:
              send("CreditsPlan 站点外部拨测告警", failures + ["新鲜度参考：" + "；".join(freshness)])
          elif SEND_OK_HEARTBEAT:
              send("CreditsPlan 外部拨测正常", freshness + ["两站首页可用，data.json 新鲜度在阈值内"])
          else:
              print("全部检查通过：" + "；".join(freshness))
          # 拨测失败不让 workflow 标红：钉钉告警即出口；workflow 自身失败另有 GitHub 邮件通知兜底
          PYEOF
